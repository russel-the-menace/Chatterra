services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatterra
      POSTGRES_USER: chatterra
      POSTGRES_PASSWORD: chatterra
    ports:
      - "5432:5432"
    volumes:
      - chatterra-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatterra -d chatterra"]
      interval: 5s
      timeout: 5s
      retries: 10

  tts:
    profiles: ["voice"]
    build: ./tts-service
    environment:
      QWEN_TTS_MODEL: Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign
      QWEN_TTS_DEVICE: cuda:0
      QWEN_TTS_ATTENTION: sdpa
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "8001:8001"
    volumes:
      - chatterra-qwen-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  chatterra-postgres:
  chatterra-qwen-cache:
