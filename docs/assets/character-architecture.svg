<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2168" role="img" aria-labelledby="title description">
  <title id="title">Chatterra character architecture</title>
  <desc id="description">A portrait architecture diagram showing a character document, versioned template, private character instance, context composer, inference orchestrator, and durable conversation output.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1 1 L13 7 L1 13 Z" fill="#8090a8"/>
    </marker>
    <style>
      .eyebrow { font: 700 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #34c759; letter-spacing: 2px; }
      .title { font: 700 48px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #152238; }
      .label { font: 700 39px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #152238; }
      .body { font: 27px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #65738a; }
      .line { stroke: #8090a8; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1000" height="2168" rx="28" fill="#f7f9fc"/>
  <text x="60" y="88" class="eyebrow">CHARACTER RUNTIME</text>
  <text x="60" y="148" class="title">A document, then a life</text>
  <text x="60" y="190" class="body">Written identity meets persistent context.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="250" width="880" height="235" rx="20" fill="#ffffff"/>
    <rect x="60" y="250" width="14" height="235" rx="7" fill="#34c759"/>
    <text x="112" y="325" class="label">1. Character document</text>
    <text x="112" y="382" class="body">Voice, rules, and language.</text>
    <text x="112" y="422" class="body">Prompt plus runtime policy.</text>
  </g>

  <path d="M500 505 V555" class="line"/>

  <g filter="url(#shadow)">
    <rect x="60" y="575" width="880" height="235" rx="20" fill="#ffffff"/>
    <rect x="60" y="575" width="14" height="235" rx="7" fill="#5f7ee7"/>
    <text x="112" y="650" class="label">2. Current template</text>
    <text x="112" y="707" class="body">A stable identity.</text>
    <text x="112" y="747" class="body">Current version registry.</text>
  </g>

  <path d="M500 830 V880" class="line"/>

  <g filter="url(#shadow)">
    <rect x="60" y="900" width="880" height="260" rx="20" fill="#ffffff"/>
    <rect x="60" y="900" width="14" height="260" rx="7" fill="#ff9f43"/>
    <text x="112" y="975" class="label">3. Private instance</text>
    <text x="112" y="1032" class="body">One user, one worldline.</text>
    <text x="112" y="1072" class="body">Memory, relationship, next action.</text>
  </g>

  <path d="M500 1180 V1260 H265 V1310" class="line"/>
  <path d="M500 1180 V1260 H735 V1310" class="line"/>

  <g filter="url(#shadow)">
    <rect x="60" y="1330" width="410" height="330" rx="20" fill="#ffffff"/>
    <rect x="60" y="1330" width="14" height="330" rx="7" fill="#8f61d9"/>
    <text x="112" y="1405" class="label">4. Context</text>
    <text x="112" y="1466" class="body">Recent chat</text>
    <text x="112" y="1510" class="body">Memory and local time</text>
    <text x="112" y="1554" class="body">Current policy</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="530" y="1330" width="410" height="330" rx="20" fill="#ffffff"/>
    <rect x="530" y="1330" width="14" height="330" rx="7" fill="#34c759"/>
    <text x="582" y="1405" class="label">5. Orchestrator</text>
    <text x="582" y="1466" class="body">Reply, teach, reach out</text>
    <text x="582" y="1510" class="body">Validate delivery</text>
    <text x="582" y="1554" class="body">Persist first</text>
  </g>

  <path d="M490 1500 H510" class="line"/>
  <path d="M735 1680 V1770" class="line"/>

  <g filter="url(#shadow)">
    <rect x="60" y="1790" width="880" height="230" rx="20" fill="#152238"/>
    <circle cx="122" cy="1855" r="19" fill="#34c759"/>
    <text x="166" y="1850" style="font: 700 39px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #ffffff;">Durable output</text>
    <text x="166" y="1910" style="font: 27px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #c9d4e5;">Messages and chat bubbles.</text>
    <text x="166" y="1952" style="font: 27px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #c9d4e5;">Voice data and contact previews.</text>
  </g>

  <text x="60" y="2100" class="body">A written identity with a persistent runtime.</text>
</svg>
